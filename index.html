<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המסע שלי 💚</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f2e9;
        color: #26352d;
    }

    .app {
        max-width: 500px;
        margin: auto;
        padding: 24px 18px 100px;
    }

    .greeting {
        margin-bottom: 24px;
    }

    .greeting h1 {
        margin: 0 0 6px;
        font-size: 30px;
    }

    .greeting p {
        margin: 0;
        color: #718078;
        font-size: 16px;
    }

    .card {
        background: #ffffff;
        border-radius: 24px;
        padding: 22px;
        margin-bottom: 16px;
        box-shadow: 0 5px 20px rgba(50, 70, 60, 0.08);
    }

    .main-card {
        background: #dce8dc;
    }

    .label {
        font-size: 14px;
        color: #64746b;
        margin-bottom: 8px;
    }

    .weight {
        font-size: 46px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .empty {
        font-size: 24px;
        font-weight: 600;
        margin: 10px 0;
    }

    .subtitle {
        color: #64746b;
        font-size: 14px;
    }

    .goal-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .goal-title h2 {
        margin: 0;
        font-size: 20px;
    }

    .goal-number {
        font-size: 34px;
        font-weight: 700;
        margin: 8px 0;
    }

    .progress {
        height: 12px;
        background: #e4e9e2;
        border-radius: 20px;
        overflow: hidden;
        margin: 16px 0 10px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: #799b82;
        border-radius: 20px;
        transition: width 0.4s ease;
    }

    .progress-text {
        font-size: 14px;
        color: #64746b;
    }

    .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .menu-button {
        border: none;
        background: #ffffff;
        border-radius: 20px;
        padding: 20px 12px;
        font-size: 15px;
        color: #26352d;
        box-shadow: 0 5px 18px rgba(50, 70, 60, 0.06);
    }

    .menu-icon {
        font-size: 28px;
        display: block;
        margin-bottom: 8px;
    }

    .start-info {
        display: flex;
        justify-content: space-between;
        gap: 12px;
    }

    .start-info div {
        flex: 1;
    }

    .small-number {
        font-size: 22px;
        font-weight: 650;
        margin-top: 5px;
    }

    .nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(500px, 100%);
        background: rgba(255,255,255,0.96);
        backdrop-filter: blur(10px);
        border-top: 1px solid #e5e7e2;
        display: flex;
        justify-content: space-around;
        padding: 12px 8px calc(12px + env(safe-area-inset-bottom));
    }

    .nav-item {
        font-size: 12px;
        color: #718078;
        text-align: center;
    }

    .nav-icon {
        display: block;
        font-size: 21px;
        margin-bottom: 3px;
    }
</style>
</head>

<body>

<div class="app">

    <div class="greeting">
        <h1>המסע שלי 🌿</h1>
        <p>כל צעד קטן הוא התקדמות.</p>
    </div>

    <div class="card main-card">
        <div class="label">המשקל הנוכחי</div>
        <div id="currentWeight" class="empty">עדיין אין שקילה</div>
        <div id="currentDate" class="subtitle">
            כשתוסיפי שקילה, היא תופיע כאן
        </div>
    </div>

    <div class="card">
        <div class="goal-title">
            <h2>המטרה הקרובה 🎯</h2>
        </div>

        <div class="goal-number">95 ק״ג</div>

        <div id="remaining" class="subtitle">
            נשארו 9.7 ק״ג
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="progressText" class="progress-text">
            מתחילים את הדרך 💚
        </div>
    </div>

    <div class="card">
        <div class="label">תחילת התהליך</div>

        <div class="start-info">
            <div>
                <div class="subtitle">משקל התחלתי</div>
                <div class="small-number">104.7 ק״ג</div>
            </div>

            <div>
                <div class="subtitle">תאריך התחלה</div>
                <div class="small-number">10/04/2026</div>
            </div>
        </div>
    </div>

    <div class="menu">
        <button class="menu-button">
            <span class="menu-icon">⚖️</span>
            מעקב משקל
        </button>

        <button class="menu-button">
            <span class="menu-icon">🍽️</span>
            קלוריות וחלבון
        </button>

        <button class="menu-button">
            <span class="menu-icon">🥗</span>
            האוכל שלי
        </button>

        <button class="menu-button">
            <span class="menu-icon">📊</span>
            ההתקדמות שלי
        </button>
    </div>

</div>

<div class="nav">
    <div class="nav-item">
        <span class="nav-icon">🏠</span>
        בית
    </div>

    <div class="nav-item">
        <span class="nav-icon">⚖️</span>
        משקל
    </div>

    <div class="nav-item">
        <span class="nav-icon">🍽️</span>
        אוכל
    </div>

    <div class="nav-item">
        <span class="nav-icon">📊</span>
        התקדמות
    </div>
</div>

<script>
    const START_WEIGHT = 104.7;
    const GOAL_WEIGHT = 95;

    const savedWeights =
        JSON.parse(localStorage.getItem("weightEntries")) || [];

    if (savedWeights.length > 0) {

        const latest =
            savedWeights[savedWeights.length - 1];

        const currentWeight =
            Number(latest.weight);

        const lost =
            START_WEIGHT - currentWeight;

        const remaining =
            Math.max(currentWeight - GOAL_WEIGHT, 0);

        const totalNeeded =
            START_WEIGHT - GOAL_WEIGHT;

        const progress =
            Math.min(Math.max((lost / totalNeeded) * 100, 0), 100);

        document.getElementById("currentWeight").textContent =
            currentWeight.toFixed(1) + " ק״ג";

        document.getElementById("currentDate").textContent =
            "שקילה אחרונה: " + latest.date;

        document.getElementById("remaining").textContent =
            "נשארו " + remaining.toFixed(1) + " ק״ג";

        document.getElementById("progressBar").style.width =
            progress + "%";

        document.getElementById("progressText").textContent =
            "ירדת " + lost.toFixed(1) +
            " ק״ג — " + Math.round(progress) +
            "% מהדרך למטרה 💚";
    }
</script>

</body>
</html>
